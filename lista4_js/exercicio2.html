<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <link rel="stylesheet" href="reset.css">
    <title>Exercício 2 - Lista 4</title>
</head>

<body>

    <header class="cabecalho">
        <h1>Veja se sua entrada é gratuita!</h1>
        <a href="./index.html"><img class="casa" src="icons8-home.svg" alt="Imagem de home"></a>
    </header>

    <div class="secao">
        <span class="span">Informe sua idade:</span>
        <input class="caixa" type="number" id="idade">
        <span class="resposta" id="resposta"></span>
        <button class="botao" onclick="verificar()">Verificar</button>
    </div>

    <script>
        function verificar() {
            var idade = document.getElementById("idade").value;
            var resposta = document.getElementById("resposta");
            resposta.classList.remove("erro")

            if (idade == "") {
                resposta.innerHTML = "Insira um número válido";
                resposta.classList.add("erro");

            } else if (idade < 5 || idade >= 65) {
                resposta.innerHTML = "Entrada gratuita!";
            } else {
                resposta.innerHTML = "Entrada é paga! Aceitamos 10x sem juros!";
            }
        }
    </script>
</body>

</html>
