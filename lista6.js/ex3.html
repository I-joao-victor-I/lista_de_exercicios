<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <link rel="stylesheet" href="reset.css">
    <title>Lista 6 - Exercício 3</title>
</head>

<body>
    <header class="cabecalho">
        <h1>Vetor inverso</h1>
        <a href="./index.html"><img class="imagem" src="./icons8-home.svg" alt=""></a>
    </header>
    <div class="secao">
        <span>Informe cinco números:</span>
        <input class="caixa" id="p1" type="number">
        <input class="caixa" id="p2" type="number">
        <input class="caixa" id="p3" type="number">
        <input class="caixa" id="p4" type="number">
        <input class="caixa" id="p5" type="number">
        <button class="botao" onclick="Verificar()">Verificar</button>
        <span id="resultado"></span>
    </div>

    <script>
        function Verificar() {
            var resultado = document.getElementById("resultado");

            var p1 = Number(document.getElementById("p1").value);
            var p2 = Number(document.getElementById("p2").value);
            var p3 = Number(document.getElementById("p3").value);
            var p4 = Number(document.getElementById("p4").value);
            var p5 = Number(document.getElementById("p5").value);

            var lista = [];
            var numeros = [p1, p2, p3, p4, p5];

            if (p1 == "" || p2 == "" || p3 == "" || p4 == "" || p5 == "") {
                resultado.innerHTML = "Insira números válidos"

            } else {
                for (let i = 4; i >= 0; i--) {
                    lista.push(numeros[i]);
                }

                resultado.innerHTML = `A lista é: ${lista}`;
            }
        }
    </script>

</body>

</html>
