<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="estilo.css">
    <title>Lista 5 - Exercício 2</title>
</head>

<body>
    <header class="cabecalho">
        <h1>Contagem</h1>
        <a href="./index.html"><img class="imagem" src="./icons8-home.svg" alt=""></a>
    </header>
    <div class="secao">
        <button class="botao apenas" onclick="Contagem()">Iniciar contagem</button>
        <span class="resultado" id="contagem"></span>
    </div>

    <script>
        async function Contagem() {
            var contagem = document.getElementById("contagem");
            const delay = ms => new Promise(resolve => setTimeout(resolve, ms));

            for (let i = 1; i <= 10; i++) {
                await delay(1000);
                contagem.innerHTML = i;

            }

        }
    </script>
</body>

</html>
