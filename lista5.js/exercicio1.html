<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista 5 - Exercício 2</title>
</head>
<body>
    <header>
        <h1>Contagem</h1>
    </header>
    <div class="secao">
        <button class="botao" onclick="Contagem()">Iniciar contagem</button>
        <span class="resultado" id="contagem"></span>
    </div>

    <script>
        async function Contagem(){
            var contagem = document.getElementById("contagem");
            const delay = ms => new Promise(resolve => setTimeout(resolve, ms));
            
            for (let i = 1; i <= 10; i++) {
                await delay(1000);
                contagem.innerHTML = i;
                
            }

        }
    </script>
</body>
</html>
