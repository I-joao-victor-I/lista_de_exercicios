<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <link rel="stylesheet" href="reset.css">
    <title>Lista 5 - Exercício 2</title>
</head>

<body>
    <header class="cabecalho">
        <h1>Contagem regressiva</h1>
        <a href="./index.html"><img class="imagem" src="./icons8-home.svg" alt=""></a>
    </header>
    <div class="secao">
        <button class="botao apenas" onclick="Contagem()">Inciar contagem</button>
        <span id="contagem"></span>
    </div>

    <script>
        async function Contagem() {
            var contagem = document.getElementById("contagem");
            const delay = ms => new Promise(resolve => setTimeout(resolve, ms));

            for (let i = 10; i >= 0; i--) {
                await delay(1000);
                contagem.innerHTML = i;


                if (i === 0) {
                    await delay(1000);
                    alert("FOGO!!!!!");
                    contagem.innerHTML = "FOGO!!!!!";
                }

            }
        }
    </script>
</body>

</html>
