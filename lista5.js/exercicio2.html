<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista 5 - Exercício 2</title>
</head>

<body>
    <header class="cabecalho">
        <h1>Contagem regressiva</h1>
    </header>
    <div class="secao">
        <button class="botao" onclick="Contagem()">Inciar contagem</button>
        <span id="contagem"></span>
    </div>

    <script>
        // Colocamos o "async" aqui antes da função
        async function Contagem() {
            var contagem = document.getElementById("contagem");
            const delay = ms => new Promise(resolve => setTimeout(resolve, ms));

            for (let i = 1; i <= 10; i++) {
                await delay(1000);
                if (i === 1) {
                    contagem.innerHTML = 10;
                }

                if (i === 2) {
                    contagem.innerHTML = 9;
                }

                if (i === 3) {
                    contagem.innerHTML = 8;
                }

                if (i === 4) {
                    contagem.innerHTML = 7;
                }

                if (i === 5) {
                    contagem.innerHTML = 6;
                }

                if (i === 6) {
                    contagem.innerHTML = 5;
                }

                if (i === 7) {
                    contagem.innerHTML = 4;
                }

                if (i === 8) {
                    contagem.innerHTML = 3;
                }

                if (i === 9) {
                    contagem.innerHTML = 2;
                }

                if (i === 10) {
                    contagem.innerHTML = 1;
                }

                if (i === 10) {
                    await delay(1000);
                    alert("FOGO!!!!!");
                    contagem.innerHTML = "FOGO!!!!!";
                }

            }
        }
    </script>
</body>

</html>
